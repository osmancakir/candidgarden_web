services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_DB: candidgarden
      POSTGRES_USER: candidgarden
      POSTGRES_PASSWORD: candidgarden
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./other/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U candidgarden -d candidgarden']
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
