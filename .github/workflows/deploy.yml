name: 🚀 Deploy

on:
  push:
    branches:
      - main
      - dev
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ⬣ ESLint
    runs-on: ubuntu-24.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 📥 Download deps
        run: npm ci
      - name: 🔬 Lint
        run: npm run lint

  typecheck:
    name: ʦ TypeScript and Worker build
    runs-on: ubuntu-24.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 📥 Download deps
        run: npm ci
      - name: 🏄 Copy test env vars
        run: cp .env.example .env
      - name: 🔎 Type check
        run: npm run typecheck
      - name: 🏗 Build Node harness
        run: npm run build
      - name: ☁️ Build Cloudflare Worker
        run: npm run build:worker

  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: candidgarden
          POSTGRES_PASSWORD: candidgarden
          POSTGRES_DB: candidgarden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U candidgarden -d candidgarden_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 📥 Download deps
        run: npm ci
      - name: 🏄 Copy test env vars
        run: cp .env.example .env
      - name: ⚡ Run Vitest
        run: npm run test -- --coverage

  playwright:
    name: 🎭 Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: candidgarden
          POSTGRES_PASSWORD: candidgarden
          POSTGRES_DB: candidgarden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U candidgarden -d candidgarden"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 📥 Download deps
        run: npm ci
      - name: 🏄 Copy test env vars
        run: cp .env.example .env
      - name: 📥 Install Playwright browser
        run: npm run test:e2e:install
      - name: 🛠 Migrate and seed database
        run: npx prisma migrate reset --force
      - name: 🏗 Build Node test harness
        run: npm run build
      - name: 🎭 Playwright tests
        run: npx playwright test
      - name: 📊 Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    name: ☁️ Deploy Cloudflare Worker
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, vitest, playwright]
    if: github.event_name == 'push'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 📥 Download deps
        run: npm ci
      - name: 🛠 Apply staging PostgreSQL migrations
        if: github.ref == 'refs/heads/dev'
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      - name: 🛠 Apply production PostgreSQL migrations
        if: github.ref == 'refs/heads/main'
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      - name: 🚀 Deploy staging
        if: github.ref == 'refs/heads/dev'
        run: npm run deploy:staging
      - name: 🚀 Deploy production
        if: github.ref == 'refs/heads/main'
        run: npm run deploy:production
